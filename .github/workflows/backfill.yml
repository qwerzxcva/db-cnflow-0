name: cnflow-backfill
# 北向资金 + 两融余额 历史全量刷新 (数据源东财 datacenter-web), 每60分钟一轮
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cnflow-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyarrow
      - name: run
        run: python cnflow_worker.py
      - name: commit
        run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "cnflow $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push
